<!DOCTYPE html>
<html>
<head>
    <title>Project 9 - ECS Fargate App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 40px;
            color: #222;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            max-width: 700px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        input, button {
            padding: 10px;
            margin-top: 8px;
            font-size: 16px;
        }
        button {
            cursor: pointer;
        }
        li {
            margin: 8px 0;
        }
        .status {
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Project 9: Production-style ECS Deployment</h1>
        <p>This app runs as multiple Docker containers: frontend, backend API, and PostgreSQL database.</p>

        <h2>API Health</h2>
        <p id="health">Checking...</p>

        <h2>Add Task</h2>
        <input id="taskInput" placeholder="Write a task..." />
        <button onclick="addTask()">Add Task</button>

        <h2>Tasks</h2>
        <ul id="tasks"></ul>
    </div>

    <script>
        async function checkHealth() {
            const res = await fetch('/api/health');
            const data = await res.json();
            document.getElementById('health').innerHTML =
                `<span class="status">${data.status}</span> - Database: ${data.database}`;
        }

        async function loadTasks() {
            const res = await fetch('/api/tasks');
            const data = await res.json();
            const list = document.getElementById('tasks');
            list.innerHTML = '';
            data.tasks.forEach(task => {
                const li = document.createElement('li');
                li.textContent = task.title;
                list.appendChild(li);
            });
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            const title = input.value.trim();

            if (!title) return;

            await fetch('/api/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title})
            });

            input.value = '';
            loadTasks();
        }

        checkHealth();
        loadTasks();
    </script>
</body>
</html>
